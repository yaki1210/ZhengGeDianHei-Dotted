[package]
name = "zhengge-font-switcher"
version = "0.1.0"
edition = "2021"
description = "Minimal Rust/eframe switcher preview for ZhengGeDianHei 16"
license = "OFL-1.1"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
