[package]
name = "zhengge-font-switcher"
version = "0.1.0"
edition = "2021"
description = "Minimal Rust/eframe switcher preview for ZhengGeDianHei 16"
license = "OFL-1.1"

[dependencies]
eframe = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
