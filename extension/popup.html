<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { width: 250px; font-family: "Microsoft YaHei", sans-serif; margin: 0; padding: 12px 14px; }
  h1 { font-size: 13px; margin: 0 0 10px; }
  .row { margin: 7px 0; font-size: 12px; }
  input { vertical-align: middle; }
  label { vertical-align: middle; cursor: pointer; }
  .note { color: #888; font-size: 11px; margin-top: 10px; line-height: 1.6; }
</style>
</head>
<body>
<h1>正格点黑 16 全局字体</h1>
<div class="row">
  <input type="checkbox" id="enable" checked>
  <label for="enable">启用强制字体</label>
</div>
<div class="row">
  <input type="checkbox" id="icons" checked>
  <label for="icons">保留图标字体</label>
</div>
<div class="note">
  开启后网页正文、按钮、输入框等全部使用「正格点黑 16」。
  图标字体会被保留，emoji 由系统自动回退。刷新页面后完全生效。
</div>
<script src="popup.js"></script>
</body>
</html>
